<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <span class="site-title">Test Blog</span>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main class="main-content">
        <section class="content-section">
            <div class="filters-container">
                <ul id="filters" class="filter-list">
                    <li><a href="#">全部</a></li>
                    <li><a href="#">默认分类</a></li>
                    <li><a href="#">分类1</a></li>
                    <li><a href="#">分类2</a></li>
                </ul>
                <div id="post-list" class="post-list">
                    <article class="post">
                        <header class="post-header">
                            <div class="post-meta">
                                <a href="#">默认分类</a>
                                <a href="#">#Tag</a>
                            </div>
                            <h1><a href="#">标题</a></h1>
                            <p>内容，随便凑点字数111111111111111111111111111111111111111111111111111111111111</p>
                        </header>
                        <footer class="post-footer">
                            <a href="#" class="author-avatar"><img alt="作者头像" src="./头像.svg"></a>
                            <a href="#" class="author-name">作者名称</a>
                            <span class="post-date">发布于2025-01-14</span>
                        </footer>
                    </article>
                </div>
            </div>
            <aside class="sidebar">侧边栏内容（可选）</aside>
        </section>
    </main>
    <footer class="footer">
        <p>© 2024 My Blog. All rights reserved.</p>
    </footer>
</body>
</html>
