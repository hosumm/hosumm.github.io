<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT 客户端示例</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        #app { text-align: center; margin-top: 50px; }
        textarea { width: 300px; height: 100px; }
    </style>
</head>
<body>

<div id="app">
    <h1>MQTT 客户端</h1>
    <input v-model="brokerUrl" placeholder="MQTT Broker URL" value="ws://broker.hivemq.com:8000/mqtt">
    <button @click="connect">连接</button>
    <hr>
    <h2>主题: {{ topic }}</h2>
    <input v-model="topic" placeholder="输入主题" value="test/topic">
    <textarea v-model="message" placeholder="输入消息">Hello, MQTT!</textarea>
    <button @click="publish">发布消息</button>
    <hr>
    <h2>接收到的消息:</h2>
    <div v-for="msg in messages" :key="msg">{{ msg }}</div>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            brokerUrl: 'ws://broker.hivemq.com:8000/mqtt',
            topic: 'test/topic',
            message: 'Hello, MQTT!',
            client: null,
            messages: []
        },
        methods: {
            connect() {
                this.client = mqtt.connect(this.brokerUrl);

                this.client.on('connect', () => {
                    console.log('连接成功');
                    this.client.subscribe(this.topic, (err) => {
                        if (!err) {
                            console.log('订阅成功:', this.topic);
                        }
                    });
                });

                this.client.on('message', (topic, message) => {
                    this.messages.push(message.toString());
                });

                this.client.on('error', (err) => {
                    console.error('连接错误:', err);
                });
            },
            publish() {
                if (this.client && this.topic && this.message) {
                    this.client.publish(this.topic, this.message);
                    this.message = ''; // 清空输入框
                }
            }
        }
    });
</script>

</body>
</html>
